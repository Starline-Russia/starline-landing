name: Deploy Starline v3 to GitHub Pages

on:
  push:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate, build, and upload Astro site
        uses: withastro/action@v6
        with:
          path: v3
          node-version: 24
          build-cmd: npm run build:pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
